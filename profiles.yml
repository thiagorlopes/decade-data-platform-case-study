decade:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: warehouse.duckdb
      threads: 4
    prod:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'workspace') }}"
      schema: decade
      threads: 4
    read_only:
      type: duckdb
      path: ':memory:'
      database: warehouse
      threads: 4
      attach:
        - path: warehouse.duckdb
          alias: warehouse
          read_only: true
