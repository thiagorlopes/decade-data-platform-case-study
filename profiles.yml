decade:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: decade.duckdb
      threads: 4
    prod:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'decade') }}"
      schema: default
      threads: 4
    read_only:
      type: duckdb
      path: ':memory:'
      database: decade
      threads: 4
      attach:
        - path: decade.duckdb
          alias: decade
          read_only: true
