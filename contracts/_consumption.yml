version: 2

# Consumption layer. Three models publish the five product families in one shape:
#
#   fct_holdings:  one row per (snapshot, account, family, holding).
#                  Unions the int_*_holdings views. Admitted lots only;
#                  quarantined and rejected lots stop at canonical.
#   fct_movements: one row per transaction_id. When a transaction is
#                  re-delivered, only the latest delivery survives. A
#                  movement the provider re-issued under another
#                  investment_id of the same holding collapses to one copy
#                  flagged duplicate:cross_id; dropped twins stay in
#                  int_*_transactions. Unions int_*_transactions.
#   dim_holding:   one row per (product_family, holding_key). Static contract
#                  of the security — name, isin, maturity, indexer, rate,
#                  issuer, ticker, fund_cnpj. Descriptive attributes live here
#                  only; the facts carry keys and measures. Join either fact
#                  on (product_family, holding_key).
#
# institution_name stays denormalized on both facts on purpose: cardinality is
# tiny and the value is stable, so the extra column is cheaper than a dim join
# in every consumer query.
#
# Tax breakdowns and unit prices stay in canonical; if you need one, query the
# family's canonical model directly.
#
# Joining a movement to its holding:
#   Both models expose holding_key. Join on it:
#     fct_movements.holding_key = fct_holdings.holding_key
#   fct_movements builds holding_key by looking up the investment_id in the
#   family's positions and taking its natural_key. If no positions row exists,
#   holding_key falls back to investment_id. fct_holdings follows the same rule.
#
# Conformed measures:
#   quantity, gross_amount, net_amount are decimal(38,10) on both facts.
#   net_amount is NULL for variable_incomes: that family carries no net
#   figure in either positions or transactions.
#
# GUARANTEE layer:
#   Contracts are enforced; the build fails if any column name or type drifts.
#   Every test here runs at error severity. Downstream consumers read only
#   these two models, and nothing below them.

models:
  - name: fct_holdings
    description: >
      One row per holding per sync, across all five product families. A
      holding groups the admitted lots that share a natural key within an
      account; quarantined and rejected lots never reach this model (README
      §Quarantine runbook). For a customer's current state, take the latest
      snapshot per (account_id, product_family).
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [snapshot_id, account_id, product_family, holding_key]
    columns:
      - name: reference_date
        data_type: date
        description: >-
          Valuation date the balance figures refer to, as stated by the provider
          (spec fields `referenceDateTime` for bank/credit/treasure, `referenceDate`
          for funds/variable_incomes). Normalized to DATE across families.
        data_tests: [not_null]
      - name: snapshot_created_at
        data_type: timestamp
        description: '{{ doc("stg_snapshot_created_at") }} This is the delivery moment, not the valuation moment — see reference_date for the latter.'
        data_tests: [not_null]
      - name: snapshot_id
        data_type: varchar
        description: '{{ doc("stg_snapshot_id") }}'
        data_tests: [not_null]
      - name: party_id
        data_type: varchar
        description: '{{ doc("stg_party_id") }}'
        data_tests: [not_null]
      - name: account_id
        data_type: varchar
        description: '{{ doc("stg_account_id") }}'
        data_tests: [not_null]
      - name: institution_id
        data_type: varchar
        description: '{{ doc("stg_institution_id") }}'
      - name: institution_name
        data_type: varchar
        description: '{{ doc("stg_institution_name") }}'
      - name: product_family
        data_type: varchar
        description: Which of the five OFB investment feeds the holding came from.
        data_tests:
          - not_null
          - accepted_values:
              values: [bank_fixed_incomes, credit_fixed_incomes, funds, treasure_titles, variable_incomes]
      - name: holding_key
        data_type: varchar
        description: >-
          Holding identity within the account: the family natural key, or the
          investment_id for lots flagged missing:natural_key.
        data_tests: [not_null]
      - name: quantity
        data_type: decimal(38,10)
        description: '{{ doc("ofb_position_quantity") }} Summed over the holding''s admitted lots. As delivered by the provider; see quantity_derived and the stale:quantity flag before trusting it.'
      - name: quantity_derived
        data_type: decimal(38,10)
        description: '{{ doc("dq_quantity_derived") }}'
      - name: gross_amount
        data_type: decimal(38,10)
        description: '{{ doc("ofb_gross_amount") }} Summed over the holding''s admitted lots.'
      - name: net_amount
        data_type: decimal(38,10)
        description: '{{ doc("ofb_net_amount") }} Summed over the holding''s admitted lots. NULL for variable incomes: the position payload for that family carries no net_amount.'
      - name: currency
        data_type: varchar
        description: '{{ doc("ofb_currency") }}'
      - name: n_investment_ids
        data_type: bigint
        description: Number of admitted position records (investment_ids) summed into the holding.
      - name: investment_ids
        data_type: varchar[]
        description: '{{ doc("ofb_investment_id") }} Every investment_id that fed this holding. To join movements to holdings, prefer holding_key on both sides; use this array only when you need the raw investment ids.'
      - name: data_quality_flags
        data_type: varchar[]
        description: '{{ doc("data_quality_flags") }}'
        data_tests: [not_null]

  - name: dim_holding
    description: >
      Static contract of each holding across families. Grain: one row per
      (product_family, holding_key). Attributes reflect the latest observed
      values across admitted lots; no SCD, later provider corrections overwrite
      earlier ones. Join fct_holdings on (product_family, holding_key) to get
      per-snapshot balances alongside static security attributes (maturity,
      indexer, rate, issuer, ticker, fund_cnpj).
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [product_family, holding_key]
    columns:
      - name: product_family
        data_type: varchar
        description: Which of the five OFB investment feeds the holding came from.
        data_tests:
          - not_null
          - accepted_values:
              values: [bank_fixed_incomes, credit_fixed_incomes, funds, treasure_titles, variable_incomes]
      - name: holding_key
        data_type: varchar
        description: >-
          Holding identity within the family: the natural key, or the
          investment_id for lots flagged missing:natural_key. Same rule as fct_holdings.
        data_tests: [not_null]
      - name: holding_name
        data_type: varchar
        description: >-
          Display name of the holding; per family, the most descriptive
          identity column (fund name, ticker, treasury product name, credit
          debtor, bank product type).
      - name: isin_code
        data_type: varchar
        description: '{{ doc("ofb_isin_code") }} NULL for funds and for holdings whose payload omitted it.'
      - name: issuer_cnpj
        data_type: varchar
        description: '{{ doc("ofb_issuer_cnpj") }} Populated for bank/credit fixed incomes and variable incomes; NULL for funds and treasure titles.'
      - name: debtor_cnpj
        data_type: varchar
        description: CNPJ of the debtor (credit fixed incomes only; NULL for other families).
      - name: debtor_name
        data_type: varchar
        description: Debtor name (credit fixed incomes only; NULL for other families).
      - name: fund_cnpj
        data_type: varchar
        description: CNPJ of the fund (funds only; NULL for other families).
      - name: ticker
        data_type: varchar
        description: Trading ticker (variable incomes only; NULL for other families).
      - name: investment_type
        data_type: varchar
        description: Product type as declared by the provider (bank/credit fixed incomes only; e.g. CDB, LCI, LCA, RDB).
      - name: indexer
        data_type: varchar
        description: Indexer name for fixed incomes (bank/credit/treasure); NULL for funds and variable incomes.
      - name: pre_fixed_rate
        data_type: decimal(12,6)
        description: '{{ doc("ofb_pre_fixed_rate") }} NULL for funds and variable incomes.'
      - name: post_fixed_indexer_percentage
        data_type: decimal(12,6)
        description: Post-fixed indexer percentage for fixed incomes. NULL for funds and variable incomes.
      - name: issue_date
        data_type: date
        description: Issue date of the security (bank/credit fixed incomes only).
      - name: due_date
        data_type: date
        description: Maturity date of the security (bank/credit/treasure fixed incomes only; NULL for funds and variable incomes, which do not mature).
      - name: purchase_date
        data_type: date
        description: Date the customer acquired the security (bank/credit/treasure fixed incomes only).

  - name: fct_movements
    description: >
      One row per movement, across all five product families. When a
      transaction is re-delivered, only the latest delivery survives. A
      movement re-issued under another investment_id of the same holding
      collapses to one copy flagged duplicate:cross_id; the dropped twin's
      transaction_id stays in int_*_transactions.
      Amounts and dates are conformed per family: funds carry the quota
      conversion date; variable incomes have no gross/net split, so
      gross_amount holds the transaction amount and net_amount is NULL.
    config:
      contract:
        enforced: true
    columns:
      - name: transaction_date
        data_type: date
        description: '{{ doc("ofb_transaction_date") }} For funds, the quota conversion date (cotizacao).'
      - name: ingested_at
        data_type: timestamp
        description: '{{ doc("stg_ingested_at") }}'
      - name: party_id
        data_type: varchar
        description: '{{ doc("stg_party_id") }}'
        data_tests: [not_null]
      - name: account_id
        data_type: varchar
        description: '{{ doc("stg_account_id") }}'
        data_tests: [not_null]
      - name: institution_id
        data_type: varchar
        description: '{{ doc("stg_institution_id") }}'
      - name: institution_name
        data_type: varchar
        description: '{{ doc("stg_institution_name") }}'
      - name: product_family
        data_type: varchar
        description: Which of the five OFB investment feeds the movement came from.
        data_tests:
          - not_null
          - accepted_values:
              values: [bank_fixed_incomes, credit_fixed_incomes, funds, treasure_titles, variable_incomes]
      - name: transaction_id
        data_type: varchar
        description: '{{ doc("ofb_transaction_id") }}'
        data_tests: [unique, not_null]
      - name: holding_key
        data_type: varchar
        description: >-
          Same value as fct_holdings.holding_key for this investment_id — the
          equi-join key from a movement to its holding. Resolved from the
          family's natural key on any snapshot in which the investment appears;
          falls back to investment_id when no natural key is available.
      - name: investment_id
        data_type: varchar
        description: '{{ doc("ofb_investment_id") }}'
      - name: movement_type
        data_type: varchar
        description: '{{ doc("ofb_movement_type") }}'
        data_tests: [not_null]
      - name: transaction_type
        data_type: varchar
        description: >-
          Movement type within the family's own enum; the per-family enums are
          documented on the int_*_transactions models.
      - name: transaction_type_additional_info
        data_type: varchar
        description: '{{ doc("ofb_transaction_type_additional_info") }}'
      - name: quantity
        data_type: decimal(38,10)
        description: '{{ doc("ofb_transaction_quantity") }} For funds, the transacted quota quantity.'
      - name: gross_amount
        data_type: decimal(38,10)
        description: '{{ doc("ofb_transaction_gross_amount") }} For variable incomes, the transaction amount (the family has no gross/net split).'
      - name: net_amount
        data_type: decimal(38,10)
        description: '{{ doc("ofb_transaction_net_amount") }} NULL for variable incomes.'
      - name: currency
        data_type: varchar
        description: '{{ doc("ofb_currency") }}'
      - name: data_quality_flags
        data_type: varchar[]
        description: '{{ doc("data_quality_flags") }}'
        data_tests: [not_null]
