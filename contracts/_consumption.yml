version: 2

# Consumption layer: the five product families conformed to one shape, one
# model per feed. fct_holdings unions the int_*_holdings views (holding
# grain per sync, admitted lots only); fct_movements unions the
# int_*_transactions tables (one row per transaction_id, latest delivery).
# Family-specific columns (fund_cnpj, isin_code, rates) deliberately stay
# in the canonical layer; consumers that need them ref the family model.
#
# This is the GUARANTEE layer: contracts are enforced (build fails on any
# column or type drift) and tests run at error severity. Consumers under
# consumers/ read these two models and nothing below them.

models:
  - name: fct_holdings
    description: >
      One row per holding per sync, across all five product families.
      A holding is the set of admitted lots sharing a natural key within an
      account; quarantined and rejected lots never reach this model (README
      §Quarantine runbook). Current state for a customer is the latest
      snapshot per (account_id, product_family).
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [snapshot_id, account_id, product_family, holding_key]
    columns:
      - name: party_id
        data_type: varchar
        description: '{{ doc("stg_party_id") }}'
        data_tests: [not_null]
      - name: account_id
        data_type: varchar
        description: '{{ doc("stg_account_id") }}'
        data_tests: [not_null]
      - name: institution_name
        data_type: varchar
        description: '{{ doc("stg_institution_name") }}'
      - name: product_family
        data_type: varchar
        description: Which of the five OFB investment feeds the holding came from.
        data_tests:
          - not_null
          - accepted_values:
              values: [bank_fixed_incomes, credit_fixed_incomes, funds, treasure_titles, variable_incomes]
      - name: holding_key
        data_type: varchar
        description: >-
          Holding identity within the account: the family natural key, or the
          investment_id for lots flagged missing_key.
        data_tests: [not_null]
      - name: holding_name
        data_type: varchar
        description: >-
          Display name of the holding; per family, the most descriptive
          identity column (fund name, ticker, treasury product name, credit
          debtor, bank product type).
      - name: snapshot_id
        data_type: varchar
        description: '{{ doc("stg_snapshot_id") }}'
        data_tests: [not_null]
      - name: snapshot_created_at
        data_type: timestamp
        description: '{{ doc("stg_snapshot_created_at") }} This is the valuation moment of the row.'
        data_tests: [not_null]
      - name: quantity
        data_type: decimal(38,10)
        description: '{{ doc("ofb_position_quantity") }} Summed over the holding''s admitted lots.'
      - name: gross_amount
        data_type: decimal(38,10)
        description: '{{ doc("ofb_gross_amount") }} Summed over the holding''s admitted lots.'
      - name: currency
        data_type: varchar
        description: '{{ doc("ofb_currency") }}'
      - name: n_lots
        data_type: bigint
        description: Number of admitted lots aggregated under the holding.
      - name: investment_ids
        data_type: varchar[]
        description: '{{ doc("ofb_investment_id") }} All ids contributing to the holding; joins a movement''s investment_id to its holding.'
      - name: data_quality_flags
        data_type: varchar[]
        description: '{{ doc("data_quality_flags") }}'
        data_tests: [not_null]

  - name: fct_movements
    description: >
      One row per movement, across all five product families, deduplicated to
      the latest delivery per transaction_id. Amount and date semantics are
      conformed per family (funds date at quota conversion; variable incomes
      carry no separate gross/net split, so gross_amount is the transaction
      amount and net_amount is NULL).
    config:
      contract:
        enforced: true
    columns:
      - name: party_id
        data_type: varchar
        description: '{{ doc("stg_party_id") }}'
        data_tests: [not_null]
      - name: account_id
        data_type: varchar
        description: '{{ doc("stg_account_id") }}'
        data_tests: [not_null]
      - name: institution_name
        data_type: varchar
        description: '{{ doc("stg_institution_name") }}'
      - name: product_family
        data_type: varchar
        description: Which of the five OFB investment feeds the movement came from.
        data_tests:
          - not_null
          - accepted_values:
              values: [bank_fixed_incomes, credit_fixed_incomes, funds, treasure_titles, variable_incomes]
      - name: transaction_id
        data_type: varchar
        description: '{{ doc("ofb_transaction_id") }}'
        data_tests: [unique, not_null]
      - name: investment_id
        data_type: varchar
        description: '{{ doc("ofb_investment_id") }}'
      - name: transaction_date
        data_type: date
        description: '{{ doc("ofb_transaction_date") }} For funds, the quota conversion date (cotizacao).'
      - name: movement_type
        data_type: varchar
        description: '{{ doc("ofb_movement_type") }}'
        data_tests: [not_null]
      - name: transaction_type
        data_type: varchar
        description: >-
          Movement type within the family's own enum; the per-family enums are
          documented on the int_*_transactions models.
      - name: transaction_type_additional_info
        data_type: varchar
        description: '{{ doc("ofb_transaction_type_additional_info") }}'
      - name: gross_amount
        data_type: decimal(25,10)
        description: '{{ doc("ofb_transaction_gross_amount") }} For variable incomes, the transaction amount (the family has no gross/net split).'
      - name: net_amount
        data_type: decimal(25,10)
        description: '{{ doc("ofb_transaction_net_amount") }} NULL for variable incomes.'
      - name: currency
        data_type: varchar
        description: '{{ doc("ofb_currency") }}'
      - name: ingested_at
        data_type: timestamp
        description: '{{ doc("stg_ingested_at") }}'
      - name: data_quality_flags
        data_type: varchar[]
        description: '{{ doc("data_quality_flags") }}'
        data_tests: [not_null]
