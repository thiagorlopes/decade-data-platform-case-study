version: 2

models:
  - name: canon_variable_incomes
    description: One row per lot. Natural key of the physical holding is (isin_code, ticker).
    data_tests: &lot_grain
      - unique:
          column_name: "snapshot_id || '/' || investment_id"
    columns: &lot_columns
      - name: snapshot_id
        data_tests: [not_null]
      - name: investment_id
        data_tests: [not_null]
      - name: account_id
        data_tests: [not_null]

  - name: canon_funds
    description: One row per lot. Natural key of the physical holding is (cnpj_number).
    data_tests: *lot_grain
    columns: *lot_columns

  - name: canon_bank_fixed_incomes
    description: One row per lot. Natural key is (isin_code, issuer_cnpj, issue_date, due_date).
    data_tests: *lot_grain
    columns: *lot_columns

  - name: canon_credit_fixed_incomes
    description: One row per lot. Natural key is (isin_code, debtor_cnpj, due_date).
    data_tests: *lot_grain
    columns: *lot_columns

  - name: canon_treasure_titles
    description: One row per lot. Natural key is (isin_code).
    data_tests: *lot_grain
    columns: *lot_columns
