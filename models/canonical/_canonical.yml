# Transactions sub-layer: one row per transaction_id, the movement history
# behind the positions. Each sync re-delivers the account's full history, so
# staging holds ~10 byte-identical copies of every movement; the intermediate
# keeps one, preferring the latest delivery (max ingested_at), so a
# re-delivery with a changed value supersedes the older copy through the same
# rule and replaying a window is a no-op. There is no admission verdict here:
# no conflicting copies exist to arbitrate, so the only defect signals are
# the missing: field flags. Tests error because grain and flag integrity are
# our own guarantees, not the provider's.
#
# Per-amount currency siblings are dropped; a single `currency` column
# (transaction_gross_amount_currency, or transaction_amount_currency for
# variable_incomes which has no gross column) stands in as the row-currency
# stamp.

  - name: int_bank_fixed_incomes_transactions
    description: >
      Bank fixed income movements, one row per transaction_id: the latest
      delivered copy of each transaction, flagged for absent spec-required fields.
    columns:
      - *c_snapshot_id
      - &c_payload_source
        name: payload_source
        description: '{{ doc("stg_payload_source") }}'
      - *c_snapshot_created_at
      - *c_institution_id
      - *c_institution_name
      - *c_party_id
      - *c_account_id
      - *c_connection_id
      - *c_investment_id
      - *c_ingested_at
      - &c_movement_type
