      - *c_institution_id
      - *c_institution_name
      - *c_party_id
      - *c_account_id
      - *c_connection_id
      - *c_investment_id
      - *c_ingested_at
      - *c_movement_type
      - name: transaction_type
        description: '{{ doc("ofb_transaction_type__variable_incomes") }}'
      - *c_transaction_type_additional_info
      - *c_transaction_date
      - name: price_factor
