version: 2

models:
  - name: int_variable_incomes_positions
    description: >
      One row per position record as delivered. Grain: (snapshot_id, investment_id).
      Holding identity across snapshots is derived downstream from (isin_code, ticker).
    data_tests: &lot_grain
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [snapshot_id, investment_id]
    columns: &lot_columns
      - name: snapshot_id
        data_tests: [not_null]
      - name: investment_id
        data_tests: [not_null]
      - name: snapshot_created_at
        data_tests: [not_null]
      - name: institution_id
        data_tests: [not_null]
      - name: institution_name
        data_tests: [not_null]
      - name: party_id
        data_tests: [not_null]
      - name: account_id
        data_tests: [not_null]
      - name: connection_id
        data_tests: [not_null]
      - name: ingested_at
        description: Arrival time of the record; the incremental watermark.
        data_tests: [not_null]

  - name: int_funds_positions
    description: >
      One row per position record as delivered. Grain: (snapshot_id, investment_id).
      Holding identity across snapshots is derived downstream from (fund_cnpj).
    data_tests: *lot_grain
    columns: *lot_columns

  - name: int_bank_fixed_incomes_positions
    description: >
      One row per position record as delivered. Grain: (snapshot_id, investment_id).
      Holding identity across snapshots is derived downstream from
      (isin_code, issuer_cnpj, issue_date, due_date).
    data_tests: *lot_grain
    columns: *lot_columns

  - name: int_credit_fixed_incomes_positions
    description: >
      One row per position record as delivered. Grain: (snapshot_id, investment_id).
      Holding identity across snapshots is derived downstream from
      (isin_code, debtor_cnpj, due_date).
    data_tests: *lot_grain
    columns: *lot_columns

  - name: int_treasure_titles_positions
    description: >
      One row per position record as delivered. Grain: (snapshot_id, investment_id).
      Holding identity across snapshots is derived downstream from (isin_code).
    data_tests: *lot_grain
    columns: *lot_columns
