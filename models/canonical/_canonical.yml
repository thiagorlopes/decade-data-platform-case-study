        description: '{{ doc("ofb_movement_type") }}'
      - name: transaction_type
        description: '{{ doc("ofb_transaction_type__bank_fixed_incomes") }}'
      - &c_transaction_type_additional_info
        name: transaction_type_additional_info
        description: '{{ doc("ofb_transaction_type_additional_info") }}'
      - &c_transaction_date
        name: transaction_date
        description: '{{ doc("ofb_transaction_date") }}'
      - &c_transaction_unit_price
        name: transaction_unit_price
        description: '{{ doc("ofb_transaction_unit_price") }}'
      - &c_transaction_quantity
        name: transaction_quantity
        description: '{{ doc("ofb_transaction_quantity") }}'
      - &c_transaction_gross_amount
        name: transaction_gross_amount
        description: '{{ doc("ofb_transaction_gross_amount") }}'
      - *c_currency
      - &c_txn_income_tax_amount
        name: income_tax_amount
        description: '{{ doc("ofb_income_tax_amount") }}'
      - &c_txn_iof_amount
        name: financial_transaction_tax_amount
        description: '{{ doc("ofb_financial_transaction_tax_amount") }}'
      - &c_transaction_net_amount
        name: transaction_net_amount
        description: '{{ doc("ofb_transaction_net_amount") }}'
      - &c_remuneration_rate
        name: remuneration_rate
        description: '{{ doc("ofb_remuneration_rate") }}'
      - &c_indexer_percentage
        name: indexer_percentage
        description: '{{ doc("ofb_indexer_percentage") }}'
      - &c_transaction_id
        name: transaction_id
        description: '{{ doc("ofb_transaction_id") }}'
        data_tests: [unique, not_null]

  - name: int_credit_fixed_incomes_transactions
    description: >
      Credit fixed income movements, one row per transaction_id: the latest
      delivered copy of each transaction, flagged for absent spec-required fields.
    columns:
      - *c_snapshot_id
      - *c_payload_source
      - *c_snapshot_created_at
      - *c_institution_id
      - *c_institution_name
      - *c_party_id
      - *c_account_id
      - *c_connection_id
      - *c_investment_id
      - *c_ingested_at
      - *c_movement_type
      - name: transaction_type
