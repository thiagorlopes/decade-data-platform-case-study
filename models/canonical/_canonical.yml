version: 2

# Intermediate layer: one row per (snapshot_id, investment_id), formed by a
# FULL JOIN between the staging detail and balances of the same asset class.
# Envelope columns are coalesced across the two sides; ingested_at is the
# max of the two, and drives the incremental watermark.
#
# The layer also repairs within-record defects (cnpj decimal tails, the
# IPC-A enum spelling, the 0001-01-01 sentinel date; notebook 02), derives
# each family's natural key from the repaired columns, and classifies
# duplicate groups within each sync (notebook 03) into `admission` and
# `dq_flags`. Rows are classified, never deleted: consumers filter
# admission = 'admit'.
#
# Tests here run at the default severity (error). After repair there is no
# excuse left: a failure means our repair or classification logic broke, not
# that a provider misbehaved. The warn-severity copies of the same checks in
# staging keep counting the provider's raw defects.
#
# Staging model contracts (grain, envelope integrity, payload defect ledger)
# live in models/canonical/staging/_staging_quality.yml. Column doc blocks
# are shared and defined once in _docs.md.

models:
  - name: int_variable_incomes_positions
    description: >
      Equity positions, one row per (snapshot_id, investment_id). Detail and
      balance staging rows joined for the same lot, repaired and classified.
      Holding identity is the ticker (notebook 03 §1.2: ISIN is blank in ~900
      rows and no account quotes two real ISINs under one ticker).
    data_tests:
      - &lot_grain
        dbt_utils.unique_combination_of_columns:
          combination_of_columns: [snapshot_id, investment_id]
      - dbt_utils.expression_is_true:
          name: int_variable_issuer_cnpj_clean
          expression: "issuer_cnpj IS NULL OR regexp_matches(issuer_cnpj, '^[0-9]{14}$')"
    columns:
      - &c_snapshot_id
        name: snapshot_id
        description: '{{ doc("stg_snapshot_id") }}'
        data_tests: [not_null]
      - &c_investment_id
        name: investment_id
        description: '{{ doc("ofb_investment_id") }}'
        data_tests: [not_null]
      - &c_snapshot_created_at
        name: snapshot_created_at
        description: '{{ doc("stg_snapshot_created_at") }}'
      - &c_institution_id
        name: institution_id
        description: '{{ doc("stg_institution_id") }}'
      - &c_institution_name
        name: institution_name
        description: '{{ doc("stg_institution_name") }}'
      - &c_party_id
        name: party_id
        description: '{{ doc("stg_party_id") }}'
      - &c_account_id
        name: account_id
        description: '{{ doc("stg_account_id") }}'
      - &c_connection_id
        name: connection_id
        description: '{{ doc("stg_connection_id") }}'
      - &c_ingested_at
        name: ingested_at
        description: '{{ doc("stg_ingested_at") }} Here it is the max of the detail and balances arrivals for the lot, and drives the incremental watermark.'
        data_tests: [not_null]
      - name: issuer_cnpj
        description: '{{ doc("ofb_issuer_cnpj") }} {{ doc("stg_cnpj_format") }}'
      - name: isin_code
        description: '{{ doc("ofb_isin_code") }}'
      - name: ticker
        description: '{{ doc("ofb_ticker") }}'
      - name: reference_date
        description: '{{ doc("ofb_reference_date") }}'
      - name: price_factor
        description: '{{ doc("ofb_price_factor") }}'
      - name: gross_amount
        description: '{{ doc("ofb_gross_amount") }}'
      - name: blocked_amount
        description: '{{ doc("ofb_blocked_amount") }}'
      - name: quantity
        description: '{{ doc("ofb_position_quantity") }}'
      - name: closing_price
        description: '{{ doc("ofb_closing_price") }}'
      - name: gross_amount_currency
        description: '{{ doc("ofb_currency") }}'
      - &c_natural_key
        name: natural_key
        description: >-
          Holding identity within an account, derived from the REPAIRED
          identity columns (key per family in the model SQL). NULL means the
          row cannot be identified: it is admitted at lot grain with
          dq_flags [missing_identity] and never merged with anything.
      - &c_admission
        name: admission
        description: '{{ doc("dq_admission") }}'
        data_tests:
          - not_null
          - accepted_values:
              values: [admit, reject_duplicate, reject_fossil, quarantine]
      - &c_dq_flags
        name: dq_flags
        description: '{{ doc("dq_flags") }}'
        data_tests: [not_null]

  - name: int_funds_positions
    description: >
      Fund positions, one row per (snapshot_id, investment_id). Detail and
      balance staging rows joined for the same lot, repaired and classified.
      Holding identity is the fund_cnpj: one open-ended fund maps to exactly
      one CNPJ.
    data_tests:
      - *lot_grain
      - dbt_utils.expression_is_true:
          name: int_funds_cnpj_clean
          expression: "fund_cnpj IS NULL OR regexp_matches(fund_cnpj, '^[0-9]{14}$')"
    columns:
      - *c_snapshot_id
      - *c_investment_id
      - *c_snapshot_created_at
      - *c_institution_id
      - *c_institution_name
      - *c_party_id
      - *c_account_id
      - *c_connection_id
      - *c_ingested_at
      - name: fund_name
        description: '{{ doc("ofb_fund_name") }}'
      - name: fund_cnpj
        description: '{{ doc("ofb_fund_cnpj") }} {{ doc("stg_cnpj_format") }}'
      - name: anbima_category
        description: '{{ doc("ofb_anbima_category") }}'
      - name: reference_date
        description: '{{ doc("ofb_reference_date") }}'
      - name: gross_amount
        description: '{{ doc("ofb_gross_amount") }}'
      - name: net_amount
        description: '{{ doc("ofb_net_amount") }}'
      - name: income_tax_amount
        description: '{{ doc("ofb_income_tax_provision") }}'
      - name: financial_transaction_tax_amount
        description: '{{ doc("ofb_financial_transaction_tax_provision") }}'
      - name: blocked_amount
        description: '{{ doc("ofb_blocked_amount") }}'
      - name: quota_quantity
        description: '{{ doc("ofb_quota_quantity") }}'
      - name: quota_gross_price
        description: '{{ doc("ofb_quota_gross_price") }}'
      - name: gross_amount_currency
        description: '{{ doc("ofb_currency") }}'
      - *c_natural_key
      - *c_admission
      - *c_dq_flags

  - name: int_bank_fixed_incomes_positions
    description: >
      Bank fixed income positions (CDB, RDB, LCI, LCA), one row per
