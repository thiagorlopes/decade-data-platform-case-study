      for the same lot, repaired and classified. Holding identity is
      (isin_code, issuer_cnpj, issue_date, due_date): banks re-use ISINs
      across CDB issuances.
    data_tests:
      - *lot_grain
      - dbt_utils.expression_is_true:
          name: int_bank_issuer_cnpj_clean
          expression: "issuer_cnpj IS NULL OR regexp_matches(issuer_cnpj, '^[0-9]{14}$')"
      - dbt_utils.expression_is_true:
          name: int_bank_no_sentinel_purchase_date
          expression: "purchase_date IS DISTINCT FROM DATE '0001-01-01'"
    columns:
      - *c_snapshot_id
      - *c_investment_id
      - *c_snapshot_created_at
      - *c_institution_id
      - *c_institution_name
      - *c_party_id
      - *c_account_id
      - *c_connection_id
      - *c_ingested_at
      - name: issuer_cnpj
        description: '{{ doc("ofb_issuer_cnpj") }} {{ doc("stg_cnpj_format") }}'
      - name: isin_code
        description: '{{ doc("ofb_isin_code") }}'
      - name: investment_type
        description: '{{ doc("ofb_product_type__bank_fixed_incomes") }}'
      - name: indexer
        description: '{{ doc("ofb_indexer") }} Repaired here: the market spelling IPC-A is mapped to the enum value IPCA.'
        data_tests:
          - accepted_values:
              values: &ofb_indexers_repaired [CDI, DI, TR, IPCA, IGP_M, IGP_DI, INPC, BCP, TLC, SELIC, PRE_FIXADO, OUTROS]
      - name: pre_fixed_rate
        description: '{{ doc("ofb_pre_fixed_rate") }}'
      - name: post_fixed_indexer_percentage
        description: '{{ doc("ofb_post_fixed_indexer_percentage") }}'
      - name: issue_unit_price
        description: '{{ doc("ofb_issue_unit_price") }}'
      - name: due_date
        description: '{{ doc("ofb_due_date") }}'
      - name: issue_date
        description: '{{ doc("ofb_issue_date") }}'
      - name: clearing_code
        description: '{{ doc("ofb_clearing_code") }}'
      - name: purchase_date
        description: '{{ doc("ofb_purchase_date") }} {{ doc("stg_purchase_date_sentinel") }}'
      - name: grace_period_date
        description: '{{ doc("ofb_grace_period_date") }}'
      - name: reference_datetime
        description: '{{ doc("ofb_reference_datetime") }}'
      - name: quantity
        description: '{{ doc("ofb_position_quantity") }}'
      - name: updated_unit_price
        description: '{{ doc("ofb_updated_unit_price") }}'
      - name: gross_amount
        description: '{{ doc("ofb_gross_amount") }}'
      - name: net_amount
        description: '{{ doc("ofb_net_amount") }}'
      - name: income_tax_amount
        description: '{{ doc("ofb_income_tax_provision") }}'
      - name: financial_transaction_tax_amount
        description: '{{ doc("ofb_financial_transaction_tax_provision") }}'
      - name: blocked_amount
        description: '{{ doc("ofb_blocked_amount") }}'
      - name: purchase_unit_price
        description: '{{ doc("ofb_purchase_unit_price") }}'
      - name: gross_amount_currency
        description: '{{ doc("ofb_currency") }}'
      - *c_natural_key
      - *c_admission
      - *c_dq_flags

