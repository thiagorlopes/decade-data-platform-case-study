version: 2

# Within-record defect detection (case study section 2.2, first tier).
# Staging is the detection layer: failures here point at the provider,
# not at our transforms. Every D-class test is severity warn with
# store_failures, so the build keeps running and failing rows land in
# the audit schema as the provider defect ledger. Nothing is repaired
# or dropped here: rows flow through as delivered.
#
# Defect classes:
#   D1  required field arriving empty            -> not_null
#   D2  right concept, wrong form                -> expression_is_true (regex)
#   D3  legal value outside the enumeration      -> accepted_values
#   D4  field contradicts another in the payload -> expression_is_true (comparison)
#
# D3 comments link the enum definition in the OFB OpenAPI specs on
# GitHub, pinned to a commit so the line anchors cannot drift. Four of
# the published spec versions exist on GitHub only as -beta.1 files;
# their content matches the published spec apart from the version string
# (line refs verified against our local copies in notebooks/.ofb_specs/).

models:
  - name: stg_openfinance__bank_fixed_incomes_positions_detail
    data_tests:
      # D2: CNPJ must be exactly 14 digits, providers send decimal tails
      - dbt_utils.expression_is_true:
          name: dq_bank_detail_cnpj_form
          expression: "regexp_matches(issuer_cnpj, '^[0-9]{14}$')"
          config: &dq_warn_stored
            severity: warn
            store_failures: true
      # D4: a title cannot be purchased before it was issued
      - dbt_utils.expression_is_true:
          name: dq_bank_detail_purchase_after_issue
          expression: "purchase_date >= issue_date"
          config: *dq_warn_stored
      # D4: a title cannot be issued after it matures
      - dbt_utils.expression_is_true:
          name: dq_bank_detail_issue_before_due
          expression: "issue_date <= due_date"
          config: *dq_warn_stored
    columns:
      # D1: fields the OFB spec marks required
      - name: issuer_cnpj
        data_tests:
          - not_null: {config: *dq_warn_stored}
      - name: investment_type
        data_tests:
          - not_null: {config: *dq_warn_stored}
          # D3: EnumInvestmentType
          # https://github.com/OpenBanking-Brasil/openapi/blob/21fed0429e5ccc0fb0854ceaec48473461093942/swagger-apis/bank-fixed-incomes/1.1.0.yml#L666
          - accepted_values:
              values: [CDB, RDB, LCI, LCA]
              config: *dq_warn_stored
      - name: indexer
        data_tests:
          - not_null: {config: *dq_warn_stored}
          # D3: EnumBankFixedIncomeIndexer
          # https://github.com/OpenBanking-Brasil/openapi/blob/21fed0429e5ccc0fb0854ceaec48473461093942/swagger-apis/bank-fixed-incomes/1.1.0.yml#L675
          - accepted_values:
              values: &ofb_indexers [CDI, DI, TR, IPCA, IGP_M, IGP_DI, INPC, BCP, TLC, SELIC, PRE_FIXADO, OUTROS]
              config: *dq_warn_stored
      - name: rate_type
        data_tests:
          # D3: EnumRateType
          # https://github.com/OpenBanking-Brasil/openapi/blob/21fed0429e5ccc0fb0854ceaec48473461093942/swagger-apis/bank-fixed-incomes/1.1.0.yml#L747
          - accepted_values:
              values: &rate_types [EXPONENCIAL, LINEAR]
              config: *dq_warn_stored
      - name: rate_periodicity
        data_tests:
          # D3: EnumRatePeriodicity
          # https://github.com/OpenBanking-Brasil/openapi/blob/21fed0429e5ccc0fb0854ceaec48473461093942/swagger-apis/bank-fixed-incomes/1.1.0.yml#L755
          - accepted_values:
              values: &rate_periodicities [MENSAL, ANUAL, DIARIO, SEMESTRAL]
              config: *dq_warn_stored
      - name: calculation
        data_tests:
          # D3: EnumCalculation
          # https://github.com/OpenBanking-Brasil/openapi/blob/21fed0429e5ccc0fb0854ceaec48473461093942/swagger-apis/bank-fixed-incomes/1.1.0.yml#L765
          - accepted_values:
              values: &calculations [DIAS_UTEIS, DIAS_CORRIDOS]
              config: *dq_warn_stored
      - name: issue_unit_price
        data_tests:
          - not_null: {config: *dq_warn_stored}
      - name: issue_unit_price_currency
        data_tests:
          - not_null: {config: *dq_warn_stored}
      - name: due_date
        data_tests:
          - not_null: {config: *dq_warn_stored}
      - name: issue_date
        data_tests:
          - not_null: {config: *dq_warn_stored}
      - name: purchase_date
        data_tests:
          - not_null: {config: *dq_warn_stored}
      - name: grace_period_date
        data_tests:
          - not_null: {config: *dq_warn_stored}

  - name: stg_openfinance__credit_fixed_incomes_positions_detail
    data_tests:
      - dbt_utils.expression_is_true:
          name: dq_credit_detail_debtor_cnpj_form
          expression: "regexp_matches(debtor_cnpj, '^[0-9]{14}$')"
          config: *dq_warn_stored
      - dbt_utils.expression_is_true:
          name: dq_credit_detail_purchase_after_issue
          expression: "purchase_date >= issue_date"
          config: *dq_warn_stored
    columns:
      - name: investment_type
        data_tests:
          - not_null: {config: *dq_warn_stored}
          # D3: EnumInvestimentType (sic, spec's own spelling)
          # https://github.com/OpenBanking-Brasil/openapi/blob/21fed0429e5ccc0fb0854ceaec48473461093942/swagger-apis/credit-fixed-incomes/1.1.0-beta.1.yml#L882
          - accepted_values:
              values: [CRA, CRI, DEBENTURES]
              config: *dq_warn_stored
      - name: tax_exempt
        data_tests:
          - not_null: {config: *dq_warn_stored}
          - accepted_values:
              values: [SIM, NAO]
              config: *dq_warn_stored
      - name: indexer
        data_tests:
          - not_null: {config: *dq_warn_stored}
          - accepted_values:
              values: *ofb_indexers
              config: *dq_warn_stored
      - name: rate_type
        data_tests:
          - accepted_values:
              values: *rate_types
              config: *dq_warn_stored
      - name: rate_periodicity
        data_tests:
          - accepted_values:
              values: *rate_periodicities
              config: *dq_warn_stored
      - name: calculation
        data_tests:
          - accepted_values:
              values: *calculations
              config: *dq_warn_stored
      - name: issue_unit_price
        data_tests:
          - not_null: {config: *dq_warn_stored}
      - name: issue_unit_price_currency
        data_tests:
          - not_null: {config: *dq_warn_stored}
      - name: issue_date
        data_tests:
          - not_null: {config: *dq_warn_stored}
      - name: due_date
        data_tests:
          - not_null: {config: *dq_warn_stored}
      - name: voucher_payment_indicator
        data_tests:
          - not_null: {config: *dq_warn_stored}
          - accepted_values:
              values: [SIM, NAO]
              config: *dq_warn_stored
      - name: voucher_payment_periodicity
        data_tests:
          # D3: VoucherPaymentPeriodicity, wider than rate_periodicity
          # https://github.com/OpenBanking-Brasil/openapi/blob/21fed0429e5ccc0fb0854ceaec48473461093942/swagger-apis/credit-fixed-incomes/1.1.0-beta.1.yml#L1340
          - accepted_values:
              values: &voucher_periodicities [MENSAL, TRIMESTRAL, SEMESTRAL, ANUAL, IRREGULAR, OUTROS]
              config: *dq_warn_stored
      - name: purchase_date
        data_tests:
          - not_null: {config: *dq_warn_stored}

  - name: stg_openfinance__funds_positions_detail
    data_tests:
      - dbt_utils.expression_is_true:
          name: dq_funds_detail_cnpj_form
          expression: "regexp_matches(fund_cnpj, '^[0-9]{14}$')"
          config: *dq_warn_stored
    columns:
      - name: fund_name
        data_tests:
          - not_null: {config: *dq_warn_stored}
      - name: fund_cnpj
        data_tests:
          - not_null: {config: *dq_warn_stored}
      - name: anbima_category
        data_tests:
          # D3: anbimaCategory
          # https://github.com/OpenBanking-Brasil/openapi/blob/21fed0429e5ccc0fb0854ceaec48473461093942/swagger-apis/funds/1.1.0-beta.1.yml#L420
          - accepted_values:
              values: [ACOES, RENDA_FIXA, MULTIMERCADO, CAMBIAL]
              config: *dq_warn_stored

  - name: stg_openfinance__treasure_titles_positions_detail
    data_tests:
      - dbt_utils.expression_is_true:
          name: dq_treasure_detail_purchase_before_due
          expression: "purchase_date <= due_date"
          config: *dq_warn_stored
      # D2: ISIN must be 2 letters, 9 alphanumerics, 1 check digit
      - dbt_utils.expression_is_true:
          name: dq_treasure_detail_isin_form
          expression: "regexp_matches(isin_code, '^[A-Z]{2}[A-Z0-9]{9}[0-9]$')"
          config: *dq_warn_stored
    columns:
      - name: isin_code
        data_tests:
          - not_null: {config: *dq_warn_stored}
      - name: product_name
        data_tests:
          - not_null: {config: *dq_warn_stored}
      - name: indexer
        data_tests:
          - not_null: {config: *dq_warn_stored}
          - accepted_values:
              values: *ofb_indexers
              config: *dq_warn_stored
      - name: rate_periodicity
        data_tests:
          - not_null: {config: *dq_warn_stored}
          - accepted_values:
              values: *rate_periodicities
              config: *dq_warn_stored
      - name: calculation
        data_tests:
          - not_null: {config: *dq_warn_stored}
          - accepted_values:
              values: *calculations
              config: *dq_warn_stored
      - name: due_date
        data_tests:
          - not_null: {config: *dq_warn_stored}
      - name: purchase_date
        data_tests:
          - not_null: {config: *dq_warn_stored}
      - name: voucher_payment_indicator
        data_tests:
          - not_null: {config: *dq_warn_stored}
          - accepted_values:
              values: [SIM, NAO]
              config: *dq_warn_stored
      - name: voucher_payment_periodicity
        data_tests:
          - accepted_values:
              values: *voucher_periodicities
              config: *dq_warn_stored

  - name: stg_openfinance__variable_incomes_positions_detail
    data_tests:
      - dbt_utils.expression_is_true:
          name: dq_variable_detail_isin_form
          expression: "regexp_matches(isin_code, '^[A-Z]{2}[A-Z0-9]{9}[0-9]$')"
          config: *dq_warn_stored
    columns:
      - name: isin_code
        data_tests:
          - not_null: {config: *dq_warn_stored}
      - name: ticker
        data_tests:
          - not_null: {config: *dq_warn_stored}

  # Transactions staging models. dbt allows a single yml entry per model,
  # so their structural grain/envelope tests (severity error) ride along
  # with the D3 warns.
  - name: stg_openfinance__bank_fixed_incomes_transactions
    description: One row per transaction.
    data_tests:
      - &txn_grain
        dbt_utils.unique_combination_of_columns:
          combination_of_columns: [snapshot_id, payload_source, investment_id, transaction_id]
      - accepted_values:
          column_name: movement_type
          values: &movement_types [ENTRADA, SAIDA]
          config: *dq_warn_stored
      # D3: EnumBankFixedIncomeTransactionType
      # https://github.com/OpenBanking-Brasil/openapi/blob/21fed0429e5ccc0fb0854ceaec48473461093942/swagger-apis/bank-fixed-incomes/1.1.0.yml#L1042
      - accepted_values:
          column_name: transaction_type
          values: [APLICACAO, RESGATE, CANCELAMENTO, PAGAMENTO_JUROS, AMORTIZACAO,
                   VENCIMENTO, TRANSFERENCIA_TITULARIDADE, TRANSFERENCIA_CUSTODIA, OUTROS]
          config: *dq_warn_stored
    columns: &txn_columns
      - name: snapshot_id
        data_tests: [not_null]
      - name: investment_id
        data_tests: [not_null]
      - name: transaction_id
        data_tests: [not_null]
      - name: snapshot_created_at
        data_tests: [not_null]
      - name: institution_id
        data_tests: [not_null]
      - name: institution_name
        data_tests: [not_null]
      - name: party_id
        data_tests: [not_null]
      - name: account_id
        data_tests: [not_null]
      - name: connection_id
        data_tests: [not_null]
      - name: ingested_at
        description: Arrival time of the record; the incremental watermark.
        data_tests: [not_null]

  - name: stg_openfinance__credit_fixed_incomes_transactions
    description: One row per transaction.
    data_tests:
      - *txn_grain
      - accepted_values:
          column_name: movement_type
          values: *movement_types
          config: *dq_warn_stored
      # D3: TransactionType
      # https://github.com/OpenBanking-Brasil/openapi/blob/21fed0429e5ccc0fb0854ceaec48473461093942/swagger-apis/credit-fixed-incomes/1.1.0-beta.1.yml#L1275
      - accepted_values:
          column_name: transaction_type
          values: [COMPRA, VENDA, CANCELAMENTO, PAGAMENTO_JUROS, AMORTIZACAO, VENCIMENTO,
                   TRANSFERENCIA_TITULARIDADE, TRANSFERENCIA_CUSTODIA, MORA, MULTA, PREMIO, OUTROS]
          config: *dq_warn_stored
    columns: *txn_columns

  - name: stg_openfinance__funds_transactions
    description: One row per transaction.
    data_tests:
      - *txn_grain
      - accepted_values:
          column_name: movement_type
          values: *movement_types
          config: *dq_warn_stored
      # D3: EnumFundsTransactionsTransactionType
      # https://github.com/OpenBanking-Brasil/openapi/blob/21fed0429e5ccc0fb0854ceaec48473461093942/swagger-apis/funds/1.1.0-beta.1.yml#L1199
      - accepted_values:
          column_name: transaction_type
          values: [APLICACAO, RESGATE, AMORTIZACAO, COME_COTAS, TRANSFERENCIA_COTAS, OUTROS]
          config: *dq_warn_stored
    columns: *txn_columns

  - name: stg_openfinance__treasure_titles_transactions
    description: One row per transaction.
    data_tests:
      - *txn_grain
      - accepted_values:
          column_name: movement_type
          values: *movement_types
          config: *dq_warn_stored
      # D3: TreasureTitlesTransactionType
      # https://github.com/OpenBanking-Brasil/openapi/blob/21fed0429e5ccc0fb0854ceaec48473461093942/swagger-apis/treasure-titles/1.1.0-beta.1.yml#L1015
      - accepted_values:
          column_name: transaction_type
          values: [COMPRA, VENDA, CANCELAMENTO, PAGAMENTO_JUROS, AMORTIZACAO,
                   VENCIMENTO, TRANSFERENCIA_TITULARIDADE, TRANSFERENCIA_CUSTODIA, OUTROS]
          config: *dq_warn_stored
    columns: *txn_columns

  - name: stg_openfinance__variable_incomes_transactions
    description: One row per transaction.
    data_tests:
      - *txn_grain
      - accepted_values:
          column_name: movement_type
          values: *movement_types
          config: *dq_warn_stored
      # D3: EnumVariableIncomesTransactionsTransactionType
      # https://github.com/OpenBanking-Brasil/openapi/blob/21fed0429e5ccc0fb0854ceaec48473461093942/swagger-apis/variable-incomes/1.3.0-beta.1.yml#L953
      - accepted_values:
          column_name: transaction_type
          values: [COMPRA, VENDA, TRANSFERENCIA_CUSTODIA, TRANSFERENCIA_TITULARIDADE,
                   DIVIDENDOS, JCP, ALUGUEIS, OUTROS]
          config: *dq_warn_stored
    columns: *txn_columns
