  # ---------------------------------------------------------------------
  # Transactions staging models. dbt allows a single yml entry per model,
  # so their structural grain/envelope tests (severity error) ride along
  # with the D3 warns.
  # ---------------------------------------------------------------------
  - name: stg_openfinance__bank_fixed_incomes_transactions
    description: >-
      Movements on bank fixed income positions (CDB, RDB, LCI, LCA), from
      GET /investments/{investmentId}/transactions and /transactions-current
      of the OFB bank-fixed-incomes API v1.1.0. One row per movement per
      source endpoint: grain (snapshot_id, payload_source, investment_id,
      transaction_id); the same movement may arrive under both
      payload_source values, deduplication happens downstream.
      {{ doc("stg_contract") }}
    data_tests:
      - &txn_grain
        dbt_utils.unique_combination_of_columns:
          combination_of_columns: [snapshot_id, payload_source, investment_id, transaction_id]
      - accepted_values:
          column_name: movement_type
          values: &movement_types [ENTRADA, SAIDA]
          config: *dq_warn_stored
      # EnumBankFixedIncomeTransactionType
      # https://github.com/OpenBanking-Brasil/openapi/blob/21fed0429e5ccc0fb0854ceaec48473461093942/swagger-apis/bank-fixed-incomes/1.1.0.yml#L1042
      - accepted_values:
          column_name: transaction_type
          values: [APLICACAO, RESGATE, CANCELAMENTO, PAGAMENTO_JUROS, AMORTIZACAO,
                   VENCIMENTO, TRANSFERENCIA_TITULARIDADE, TRANSFERENCIA_CUSTODIA, OUTROS]
          config: *dq_warn_stored
    columns:
      - *env_snapshot_id
      - *env_investment_id
      - *env_snapshot_created
      - *env_institution_id
      - *env_institution_name
      - *env_party_id
      - *env_account_id
      - *env_connection_id
      - *env_ingested_at
      - &col_payload_source
        name: payload_source
