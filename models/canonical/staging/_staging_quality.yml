version: 2

# Within-record defect detection (case study section 2.2, first tier).
# Staging is the detection layer for two owners:
#
#   Envelope (ours). Columns our ingestion attaches: snapshot_id,
#   investment_id, snapshot_created_at, institution_id, institution_name,
#   party_id, account_id, connection_id, ingested_at, plus the grain.
#   Default severity (error): a null or duplicated grain means our
#   pipeline is broken and the build must halt.
#
#   Payload (provider's). Columns flattened from the provider JSON.
#   Severity warn with store_failures: the build keeps running and
#   failing rows land in the audit schema as the provider defect ledger.
#   Nothing is repaired or dropped here. Four checks the OFB spec would
#   catch if providers respected it:
#     required field arriving empty         -> not_null
#     right concept, wrong form             -> expression_is_true (regex)
#     legal value outside the enumeration   -> accepted_values
#     field contradicts another in payload  -> expression_is_true (comparison)
#
# Descriptions live once as {% docs %} blocks in ../ _docs.md and are
# referenced via {{ doc(...) }}. Repeated column entries use YAML anchors
# so each definition exists exactly once in this file too.

models:
  # ---------------------------------------------------------------------
  # Position detail: contractual identity of each instrument
  # ---------------------------------------------------------------------
  - name: stg_openfinance__bank_fixed_incomes_positions_detail
    description: >-
      Contractual identity of bank-issued fixed income positions: CDB and RDB
      (bank deposit certificates) and LCI/LCA (real-estate/agribusiness
      letters, income-tax exempt for individuals). One row per
      (snapshot_id, investment_id) from GET /investments/{investmentId} of
      the OFB bank-fixed-incomes API v1.1.0. Holding identity across
      snapshots is derived downstream from
      (isin_code, issuer_cnpj, issue_date, due_date).
      {{ doc("stg_contract") }}
    data_tests:
      - &lot_grain
        dbt_utils.unique_combination_of_columns:
          combination_of_columns: [snapshot_id, investment_id]
      # CNPJ must be exactly 14 digits, providers send decimal tails
      - dbt_utils.expression_is_true:
          name: dq_bank_detail_cnpj_form
          expression: "regexp_matches(issuer_cnpj, '^[0-9]{14}$')"
          config: &dq_warn_stored
            severity: warn
            store_failures: true
      # 0001-01-01 is .NET DateTime.MinValue: a missing purchase date in
      # a real-looking date costume. Named explicitly so it doesn't leak
      # into the cross-field rules below as a false positive.
      - dbt_utils.expression_is_true:
          name: dq_bank_detail_purchase_date_not_sentinel
          expression: "purchase_date <> DATE '0001-01-01'"
          config: *dq_warn_stored
      # cross-field date ordering. sentinel rows excluded so they don't
      # double-warn: they belong to the dedicated sentinel check above.
      - dbt_utils.expression_is_true:
          name: dq_bank_detail_purchase_after_issue
          expression: "purchase_date = DATE '0001-01-01' OR purchase_date >= issue_date"
          config: *dq_warn_stored
      - dbt_utils.expression_is_true:
          name: dq_bank_detail_issue_before_due
          expression: "issue_date <= due_date"
          config: *dq_warn_stored
      - dbt_utils.expression_is_true:
          name: dq_bank_detail_purchase_before_due
          expression: "purchase_date = DATE '0001-01-01' OR purchase_date <= due_date"
          config: *dq_warn_stored
    columns:
      # envelope. Default severity (error).
      - &env_snapshot_id
        name: snapshot_id
        description: '{{ doc("stg_snapshot_id") }}'
        data_tests: [not_null]
      - &env_investment_id
        name: investment_id
        description: '{{ doc("ofb_investment_id") }}'
        data_tests: [not_null]
      - &env_snapshot_created
        name: snapshot_created_at
        description: '{{ doc("stg_snapshot_created_at") }}'
        data_tests: [not_null]
      - &env_institution_id
        name: institution_id
        description: '{{ doc("stg_institution_id") }}'
        data_tests: [not_null]
      - &env_institution_name
        name: institution_name
        description: '{{ doc("stg_institution_name") }}'
        data_tests: [not_null]
      - &env_party_id
        name: party_id
        description: '{{ doc("stg_party_id") }}'
        data_tests: [not_null]
      - &env_account_id
        name: account_id
        description: '{{ doc("stg_account_id") }}'
        data_tests: [not_null]
      - &env_connection_id
        name: connection_id
        description: '{{ doc("stg_connection_id") }}'
        data_tests: [not_null]
      - &env_ingested_at
        name: ingested_at
        description: '{{ doc("stg_ingested_at") }}'
        data_tests: [not_null]
      # payload, in spec order. Fields the OFB spec marks required carry
      # warn-severity not_null.
      - name: issuer_cnpj
        description: '{{ doc("ofb_issuer_cnpj") }} {{ doc("stg_cnpj_format") }}'
        data_tests:
          - not_null: {config: *dq_warn_stored}
      - &col_isin
        name: isin_code
        description: '{{ doc("ofb_isin_code") }} {{ doc("stg_isin_format") }}'
      - name: investment_type
        description: '{{ doc("ofb_product_type__bank_fixed_incomes") }}'
        data_tests:
          - not_null: {config: *dq_warn_stored}
          # EnumInvestmentType
          # https://github.com/OpenBanking-Brasil/openapi/blob/21fed0429e5ccc0fb0854ceaec48473461093942/swagger-apis/bank-fixed-incomes/1.1.0.yml#L666
          - accepted_values:
              values: [CDB, RDB, LCI, LCA]
              config: *dq_warn_stored
      - &col_pre_fixed_rate
        name: pre_fixed_rate
        description: '{{ doc("ofb_pre_fixed_rate") }}'
      - &col_post_fixed_pct
        name: post_fixed_indexer_percentage
        description: '{{ doc("ofb_post_fixed_indexer_percentage") }}'
      - &col_rate_type
        name: rate_type
        description: '{{ doc("ofb_rate_type") }}'
        data_tests:
          # EnumRateType
          # https://github.com/OpenBanking-Brasil/openapi/blob/21fed0429e5ccc0fb0854ceaec48473461093942/swagger-apis/bank-fixed-incomes/1.1.0.yml#L747
          - accepted_values:
              values: &rate_types [EXPONENCIAL, LINEAR]
              config: *dq_warn_stored
      - &col_rate_periodicity
        name: rate_periodicity
        description: '{{ doc("ofb_rate_periodicity") }}'
        data_tests:
          # EnumRatePeriodicity
          # https://github.com/OpenBanking-Brasil/openapi/blob/21fed0429e5ccc0fb0854ceaec48473461093942/swagger-apis/bank-fixed-incomes/1.1.0.yml#L755
          - accepted_values:
              values: &rate_periodicities [MENSAL, ANUAL, DIARIO, SEMESTRAL]
              config: *dq_warn_stored
      - &col_calculation
        name: calculation
        description: '{{ doc("ofb_calculation") }}'
        data_tests:
          # EnumCalculation
          # https://github.com/OpenBanking-Brasil/openapi/blob/21fed0429e5ccc0fb0854ceaec48473461093942/swagger-apis/bank-fixed-incomes/1.1.0.yml#L765
          - accepted_values:
              values: &calculations [DIAS_UTEIS, DIAS_CORRIDOS]
              config: *dq_warn_stored
      - &col_indexer_req
        name: indexer
        description: '{{ doc("ofb_indexer") }}'
        data_tests:
          - not_null: {config: *dq_warn_stored}
          # EnumBankFixedIncomeIndexer
          # https://github.com/OpenBanking-Brasil/openapi/blob/21fed0429e5ccc0fb0854ceaec48473461093942/swagger-apis/bank-fixed-incomes/1.1.0.yml#L675
          - accepted_values:
              values: &ofb_indexers [CDI, DI, TR, IPCA, IGP_M, IGP_DI, INPC, BCP, TLC, SELIC, PRE_FIXADO, OUTROS]
              config: *dq_warn_stored
      - &col_indexer_info
        name: indexer_additional_info
        description: '{{ doc("ofb_indexer_additional_info") }}'
      - &col_issue_unit_price
        name: issue_unit_price
        description: '{{ doc("ofb_issue_unit_price") }}'
        data_tests:
          - not_null: {config: *dq_warn_stored}
      - &col_issue_unit_price_curr
        name: issue_unit_price_currency
        description: '{{ doc("ofb_currency") }}'
        data_tests:
          - not_null: {config: *dq_warn_stored}
      - &col_due_date_req
        name: due_date
        description: '{{ doc("ofb_due_date") }}'
        data_tests:
          - not_null: {config: *dq_warn_stored}
      - &col_issue_date_req
        name: issue_date
        description: '{{ doc("ofb_issue_date") }}'
        data_tests:
          - not_null: {config: *dq_warn_stored}
      - &col_clearing_code
        name: clearing_code
        description: '{{ doc("ofb_clearing_code") }}'
      - &col_purchase_date_req
        name: purchase_date
        description: '{{ doc("ofb_purchase_date") }} {{ doc("stg_purchase_date_sentinel") }}'
        data_tests:
          - not_null: {config: *dq_warn_stored}
      - name: grace_period_date
        description: '{{ doc("ofb_grace_period_date") }}'
        data_tests:
          - not_null: {config: *dq_warn_stored}

  - name: stg_openfinance__credit_fixed_incomes_positions_detail
    description: >-
      Contractual identity of securitized credit positions: CRA/CRI
      (agribusiness/real-estate receivables certificates) and DEBENTURES
      (corporate bonds). One row per (snapshot_id, investment_id) from
      GET /investments/{investmentId} of the OFB credit-fixed-incomes API
      v1.1.0. Holding identity across snapshots is derived downstream from
      (isin_code, debtor_cnpj, due_date). {{ doc("stg_contract") }}
    data_tests:
      - *lot_grain
      - dbt_utils.expression_is_true:
          name: dq_credit_detail_debtor_cnpj_form
          expression: "regexp_matches(debtor_cnpj, '^[0-9]{14}$')"
          config: *dq_warn_stored
      - dbt_utils.expression_is_true:
          name: dq_credit_detail_purchase_date_not_sentinel
          expression: "purchase_date <> DATE '0001-01-01'"
          config: *dq_warn_stored
      - dbt_utils.expression_is_true:
          name: dq_credit_detail_purchase_after_issue
          expression: "purchase_date = DATE '0001-01-01' OR purchase_date >= issue_date"
          config: *dq_warn_stored
      - dbt_utils.expression_is_true:
          name: dq_credit_detail_issue_before_due
          expression: "issue_date <= due_date"
          config: *dq_warn_stored
      - dbt_utils.expression_is_true:
          name: dq_credit_detail_purchase_before_due
          expression: "purchase_date = DATE '0001-01-01' OR purchase_date <= due_date"
          config: *dq_warn_stored
    columns:
      - *env_snapshot_id
      - *env_investment_id
      - *env_snapshot_created
      - *env_institution_id
      - *env_institution_name
      - *env_party_id
      - *env_account_id
      - *env_connection_id
      - *env_ingested_at
      - &col_issuer_cnpj_plain
        name: issuer_cnpj
        description: '{{ doc("ofb_issuer_cnpj") }} {{ doc("stg_cnpj_format") }}'
      - *col_isin
      - name: investment_type
        description: '{{ doc("ofb_product_type__credit_fixed_incomes") }}'
        data_tests:
          - not_null: {config: *dq_warn_stored}
          # EnumInvestimentType (sic, spec's own spelling)
          # https://github.com/OpenBanking-Brasil/openapi/blob/21fed0429e5ccc0fb0854ceaec48473461093942/swagger-apis/credit-fixed-incomes/1.1.0-beta.1.yml#L882
          - accepted_values:
              values: [CRA, CRI, DEBENTURES]
              config: *dq_warn_stored
      - name: debtor_cnpj
        description: '{{ doc("ofb_debtor_cnpj") }} {{ doc("stg_cnpj_format") }}'
      - name: debtor_name
        description: '{{ doc("ofb_debtor_name") }}'
      - name: tax_exempt
        description: '{{ doc("ofb_tax_exempt") }}'
        data_tests:
          - not_null: {config: *dq_warn_stored}
          - accepted_values:
              values: [SIM, NAO]
              config: *dq_warn_stored
      - *col_pre_fixed_rate
      - *col_post_fixed_pct
      - *col_rate_type
      - *col_rate_periodicity
      - *col_calculation
      - *col_indexer_req
      - *col_indexer_info
      - *col_issue_unit_price
      - *col_issue_unit_price_curr
      - *col_issue_date_req
      - *col_due_date_req
      - &col_voucher_indicator
        name: voucher_payment_indicator
        description: '{{ doc("ofb_voucher_payment_indicator") }}'
        data_tests:
          - not_null: {config: *dq_warn_stored}
          - accepted_values:
              values: [SIM, NAO]
              config: *dq_warn_stored
      - &col_voucher_periodicity
        name: voucher_payment_periodicity
        description: '{{ doc("ofb_voucher_payment_periodicity") }}'
        data_tests:
          # VoucherPaymentPeriodicity, wider than rate_periodicity
          # https://github.com/OpenBanking-Brasil/openapi/blob/21fed0429e5ccc0fb0854ceaec48473461093942/swagger-apis/credit-fixed-incomes/1.1.0-beta.1.yml#L1340
          - accepted_values:
              values: &voucher_periodicities [MENSAL, TRIMESTRAL, SEMESTRAL, ANUAL, IRREGULAR, OUTROS]
              config: *dq_warn_stored
      - &col_voucher_periodicity_info
        name: voucher_payment_periodicity_additional_info
        description: '{{ doc("ofb_voucher_payment_periodicity_additional_info") }}'
      - *col_clearing_code
      - *col_purchase_date_req
      - name: grace_period_date
        description: '{{ doc("ofb_grace_period_date") }}'

  - name: stg_openfinance__funds_positions_detail
    description: >-
      Identity of investment fund positions: fund name, CNPJ and ANBIMA
      classification. One row per (snapshot_id, investment_id) from
      GET /investments/{investmentId} of the OFB funds API v1.1.0. Holding
      identity across snapshots is derived downstream from (fund_cnpj).
      {{ doc("stg_contract") }}
    data_tests:
      - *lot_grain
      - dbt_utils.expression_is_true:
          name: dq_funds_detail_cnpj_form
          expression: "regexp_matches(fund_cnpj, '^[0-9]{14}$')"
          config: *dq_warn_stored
    columns:
      - *env_snapshot_id
      - *env_investment_id
      - *env_snapshot_created
      - *env_institution_id
      - *env_institution_name
      - *env_party_id
      - *env_account_id
      - *env_connection_id
      - *env_ingested_at
      - name: fund_name
        description: '{{ doc("ofb_fund_name") }}'
        data_tests:
          - not_null: {config: *dq_warn_stored}
      - name: fund_cnpj
        description: '{{ doc("ofb_fund_cnpj") }} {{ doc("stg_cnpj_format") }}'
        data_tests:
          - not_null: {config: *dq_warn_stored}
      - *col_isin
      - name: anbima_category
        description: '{{ doc("ofb_anbima_category") }}'
        data_tests:
          # anbimaCategory
          # https://github.com/OpenBanking-Brasil/openapi/blob/21fed0429e5ccc0fb0854ceaec48473461093942/swagger-apis/funds/1.1.0-beta.1.yml#L420
          - accepted_values:
              values: [ACOES, RENDA_FIXA, MULTIMERCADO, CAMBIAL]
              config: *dq_warn_stored
      - name: anbima_class
        description: '{{ doc("ofb_anbima_class") }}'
      - name: anbima_subclass
        description: '{{ doc("ofb_anbima_subclass") }}'

  - name: stg_openfinance__treasure_titles_positions_detail
    description: >-
      Contractual identity of Tesouro Direto positions, Brazilian federal
      government bonds (e.g. Tesouro Selic, Tesouro IPCA+, Tesouro
      Prefixado). One row per (snapshot_id, investment_id) from
      GET /investments/{investmentId} of the OFB treasure-titles API v1.1.0.
      Holding identity across snapshots is derived downstream from
      (isin_code). {{ doc("stg_contract") }}
    data_tests:
      - *lot_grain
      - dbt_utils.expression_is_true:
          name: dq_treasure_detail_purchase_date_not_sentinel
          expression: "purchase_date <> DATE '0001-01-01'"
          config: *dq_warn_stored
      - dbt_utils.expression_is_true:
          name: dq_treasure_detail_purchase_before_due
          expression: "purchase_date = DATE '0001-01-01' OR purchase_date <= due_date"
          config: *dq_warn_stored
      # ISIN must be 2 letters, 9 alphanumerics, 1 check digit
      - dbt_utils.expression_is_true:
          name: dq_treasure_detail_isin_form
          expression: "regexp_matches(isin_code, '^[A-Z]{2}[A-Z0-9]{9}[0-9]$')"
          config: *dq_warn_stored
    columns:
      - *env_snapshot_id
      - *env_investment_id
      - *env_snapshot_created
      - *env_institution_id
      - *env_institution_name
      - *env_party_id
      - *env_account_id
      - *env_connection_id
      - *env_ingested_at
      - name: isin_code
        description: '{{ doc("ofb_isin_code") }} {{ doc("stg_isin_format") }} The downstream holding-identity key for treasury bonds.'
        data_tests:
          - not_null: {config: *dq_warn_stored}
      - name: product_name
        description: '{{ doc("ofb_product_name") }}'
        data_tests:
          - not_null: {config: *dq_warn_stored}
      - *col_indexer_req
      - *col_indexer_info
      - *col_pre_fixed_rate
      - *col_post_fixed_pct
      - name: rate_periodicity
        description: '{{ doc("ofb_rate_periodicity") }}'
        data_tests:
          - not_null: {config: *dq_warn_stored}
          - accepted_values:
              values: *rate_periodicities
              config: *dq_warn_stored
      - name: calculation
        description: '{{ doc("ofb_calculation") }}'
        data_tests:
          - not_null: {config: *dq_warn_stored}
          - accepted_values:
              values: *calculations
              config: *dq_warn_stored
      - *col_due_date_req
      - *col_purchase_date_req
      - *col_voucher_indicator
      - *col_voucher_periodicity
      - *col_voucher_periodicity_info

  - name: stg_openfinance__variable_incomes_positions_detail
    description: >-
      Identity of exchange-traded equity positions: ISIN and trading ticker.
      One row per (snapshot_id, investment_id) from
      GET /investments/{investmentId} of the OFB variable-incomes API v1.3.0.
      Holding identity across snapshots is derived downstream from
      (isin_code, ticker). {{ doc("stg_contract") }}
    data_tests:
      - *lot_grain
      - dbt_utils.expression_is_true:
          name: dq_variable_detail_issuer_cnpj_form
          expression: "regexp_matches(issuer_cnpj, '^[0-9]{14}$')"
          config: *dq_warn_stored
      - dbt_utils.expression_is_true:
          name: dq_variable_detail_isin_form
          expression: "regexp_matches(isin_code, '^[A-Z]{2}[A-Z0-9]{9}[0-9]$')"
          config: *dq_warn_stored
    columns:
      - *env_snapshot_id
      - *env_investment_id
      - *env_snapshot_created
      - *env_institution_id
      - *env_institution_name
      - *env_party_id
      - *env_account_id
      - *env_connection_id
      - *env_ingested_at
      - *col_issuer_cnpj_plain
      - name: isin_code
        description: '{{ doc("ofb_isin_code") }} {{ doc("stg_isin_format") }}'
        data_tests:
          - not_null: {config: *dq_warn_stored}
      - name: ticker
        description: '{{ doc("ofb_ticker") }}'
        data_tests:
          - not_null: {config: *dq_warn_stored}

  # ---------------------------------------------------------------------
  # Position balances: point-in-time valuation of each instrument.
  # Same envelope/grain contract as detail; payload columns are the
  # provider's own valuation, so no warn tests are defined here yet.
  # ---------------------------------------------------------------------
  - name: stg_openfinance__bank_fixed_incomes_positions_balances
    description: >-
      Point-in-time valuation of bank fixed income positions (CDB, RDB, LCI,
      LCA): quantity, marked prices, gross/net values, tax provisions and
      blocks, from GET /investments/{investmentId}/balances of the OFB
      bank-fixed-incomes API v1.1.0. One row per (snapshot_id,
      investment_id); use the latest snapshot for current value.
      {{ doc("stg_contract") }}
    data_tests:
      - *lot_grain
    columns:
      - *env_snapshot_id
      - *env_investment_id
      - *env_snapshot_created
      - *env_institution_id
      - *env_institution_name
      - *env_party_id
      - *env_account_id
      - *env_connection_id
      - *env_ingested_at
      - &col_reference_datetime
        name: reference_datetime
        description: '{{ doc("ofb_reference_datetime") }}'
      - &col_bal_quantity
        name: quantity
        description: '{{ doc("ofb_position_quantity") }}'
      - &col_updated_unit_price
        name: updated_unit_price
        description: '{{ doc("ofb_updated_unit_price") }}'
      - &col_updated_unit_price_curr
        name: updated_unit_price_currency
        description: '{{ doc("ofb_currency") }}'
      - &col_gross_amount
        name: gross_amount
        description: '{{ doc("ofb_gross_amount") }}'
      - &col_gross_amount_curr
        name: gross_amount_currency
        description: '{{ doc("ofb_currency") }}'
      - &col_net_amount
        name: net_amount
        description: '{{ doc("ofb_net_amount") }}'
      - &col_net_amount_curr
        name: net_amount_currency
        description: '{{ doc("ofb_currency") }}'
      - &col_bal_income_tax
        name: income_tax_amount
        description: '{{ doc("ofb_income_tax_provision") }}'
      - &col_bal_income_tax_curr
        name: income_tax_amount_currency
        description: '{{ doc("ofb_currency") }}'
      - &col_bal_iof
        name: financial_transaction_tax_amount
        description: '{{ doc("ofb_financial_transaction_tax_provision") }}'
      - &col_bal_iof_curr
        name: financial_transaction_tax_amount_currency
        description: '{{ doc("ofb_currency") }}'
      - &col_blocked_amount
        name: blocked_amount
        description: '{{ doc("ofb_blocked_amount") }}'
      - &col_blocked_amount_curr
        name: blocked_amount_currency
        description: '{{ doc("ofb_currency") }}'
      - &col_purchase_unit_price
        name: purchase_unit_price
        description: '{{ doc("ofb_purchase_unit_price") }}'
      - &col_purchase_unit_price_curr
        name: purchase_unit_price_currency
        description: '{{ doc("ofb_currency") }}'
      - *col_pre_fixed_rate
      - *col_post_fixed_pct

  - name: stg_openfinance__credit_fixed_incomes_positions_balances
    description: >-
      Point-in-time valuation of securitized credit positions (CRA, CRI,
      DEBENTURES), from GET /investments/{investmentId}/balances of the OFB
      credit-fixed-incomes API v1.1.0. Extends the common balance shape with
      debtor-default tracking: fine_amount (multa) and late_payment_amount
      (mora). One row per (snapshot_id, investment_id); use the latest
      snapshot for current value. {{ doc("stg_contract") }}
    data_tests:
      - *lot_grain
    columns:
      - *env_snapshot_id
      - *env_investment_id
      - *env_snapshot_created
      - *env_institution_id
      - *env_institution_name
      - *env_party_id
      - *env_account_id
      - *env_connection_id
      - *env_ingested_at
      - *col_reference_datetime
      - *col_updated_unit_price
      - *col_updated_unit_price_curr
      - *col_bal_quantity
      - *col_gross_amount
      - *col_gross_amount_curr
