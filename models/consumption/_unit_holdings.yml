version: 2

# Unit test for the resolved quantity. It feeds fixed holding rows to
# fct_holdings and checks the exact output. The expected rows state the
# promise the plain columns make: quantity is resolved once (the replay,
# unless it is untrustworthy, then the provider's number), gross_amount
# is recomputed from it, and the provider's claims keep the _reported
# suffix.
#
# The resolution treats every family the same way. Funds carries the
# fixtures; the other families stay empty.
#
# Three holdings, reported quantity 10 and unit price 2 on all. Each
# line states the situation, then the quantity the contract must carry:
# - Q_a: the replay says 4 and nothing distrusts it. The 4 wins over
#   the reported 10, and gross follows.
# - Q_b: there is no replay. The reported 10 fills in.
# - Q_c: the replay says 7, but the holding carries
#   movements:incomplete. The reported 10 wins, and gross follows it.
# - Q_d: movements:incomplete again, but the provider's own row fails
#   gross = quantity x price (gross 15, quantity 10, price 2). Gross and
#   price corroborate each other and the quantity is the odd field out,
#   so quantity anchors to gross / price (7.5) and gross follows the
#   provider's valuation (15).
unit_tests:
  - name: quantity_resolution
    model: fct_holdings
    given:
      # SQL format because dict fixtures cannot express arrays portably:
      # dbt casts their values as strings, and only DuckDB accepts that.
      # The flags build through filter(split(...)), which both engines
      # parse the same way; an empty string becomes an empty array.
      - input: ref('int_funds_holdings')
        format: sql
        rows: |
          SELECT
              CAST(NULL AS TIMESTAMP) AS snapshot_created_at,
              CAST(NULL AS DATE) AS reference_date,
              'S1' AS snapshot_id,
              'A1' AS account_id,
              CAST(NULL AS STRING) AS party_id,
              CAST(NULL AS STRING) AS institution_id,
              CAST(NULL AS STRING) AS institution_name,
              core.holding_key,
              CAST(NULL AS STRING) AS fund_name,
              CAST(NULL AS STRING) AS fund_cnpj,
              CAST(NULL AS STRING) AS isin_code,
              CAST(10 AS DECIMAL(38, 10)) AS quantity,
              CAST(core.quantity_derived AS DECIMAL(38, 10)) AS quantity_derived,
              CAST(core.gross_amount AS DECIMAL(38, 10)) AS gross_amount,
              CAST(NULL AS DECIMAL(38, 10)) AS net_amount,
              CAST(NULL AS STRING) AS currency,
              CAST(2 AS DECIMAL(38, 10)) AS unit_price,
              CAST(NULL AS BIGINT) AS n_investment_ids,
              filter(split('', ','), f -> f <> '') AS investment_ids,
              filter(split(core.flags, ','), f -> f <> '') AS data_quality_flags
          FROM (
              SELECT 'Q_a' AS holding_key, 4 AS quantity_derived, CAST(NULL AS INT) AS gross_amount, 'quantity_reported:stale' AS flags
              UNION ALL SELECT 'Q_b', NULL, NULL, ''
              UNION ALL SELECT 'Q_c', 7, NULL, 'movements:incomplete'
              UNION ALL SELECT 'Q_d', 7, 15, 'movements:incomplete,gross:not_quantity_times_price'
          ) AS core
      - input: ref('int_bank_fixed_incomes_holdings')
        rows: []
      - input: ref('int_credit_fixed_incomes_holdings')
        rows: []
      - input: ref('int_treasure_titles_holdings')
        rows: []
      - input: ref('int_variable_incomes_holdings')
        rows: []
    expect:
      rows:
        - {holding_key: Q_a, quantity: 4, gross_amount: 8, quantity_reported: 10}
        - {holding_key: Q_b, quantity: 10, gross_amount: 20, quantity_reported: 10}
        - {holding_key: Q_c, quantity: 10, gross_amount: 20, quantity_reported: 10}
        - {holding_key: Q_d, quantity: 7.5, gross_amount: 15, quantity_reported: 10}
