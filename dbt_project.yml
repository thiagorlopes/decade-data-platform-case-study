name: decade
version: 1.0.0
profile: decade
config-version: 2

# contracts/ is a model path so the output contract is executable from there
model-paths: ["models", "contracts"]

# materialization rationale: README.md § Materializations
models:
  decade:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
    canonical:
      +materialized: incremental
      +unique_key: [snapshot_id, investment_id]
      intermediate:
        holdings:
          # view, not incremental: zero:transient/investment_id:replaced lag over the full
          # timeline of the incremental positions tables
          +materialized: view
    consumption:
      +materialized: table
