name: decade
version: 1.0.0
profile: decade
config-version: 2

# contracts/ is a model path so the output contract is executable from there
model-paths: ["models", "contracts"]

# materialization rationale: README.md § Materializations
models:
  decade:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: staging
    canonical:
      +materialized: incremental
      +unique_key: [snapshot_id, investment_id]
      +schema: canonical
      intermediate:
        holdings:
          # view, not incremental: gross:zero_transient/investment_id:replaced lag over the full
          # timeline of the incremental positions tables
          +materialized: view
    consumption:
      +materialized: table
      +schema: consumption
      # clustering rationale: README.md § Physical layout; dbt-duckdb ignores the key
      fct_holdings:
        +liquid_clustered_by: [party_id, snapshot_created_at]
      fct_movements:
        +liquid_clustered_by: [party_id, transaction_date]
