# This job runs the two commands the README gives the reader. `make install`
# builds the image. `make build` runs the models and tests inside it. So CI
# checks the instructions a reader follows, not a path only CI takes.
#
# Expect 19 warns. They are the staging detect-tier rules doing their job.
# `dbt build` exits 0 on a warn, so the job stays green and the warn counts
# stay visible.
name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: models + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: make install

      - name: Run models and tests
        run: |
          set -o pipefail
          make build 2>&1 | tee /tmp/build.log

      # Catches dialect drift: SQL DuckDB accepts that Databricks would reject.
      - name: Compile against Databricks
        if: github.repository == 'thiagorlopes/decade-data-platform-case-study'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          docker compose run --rm -u $(id -u):$(id -g) dbt \
            dbt compile --target prod

      - name: Post build summary
        if: always()
        run: |
          {
            echo '### dbt build'
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' /tmp/build.log \
              | grep -E 'Done\.|Completed with' | tail -n 3
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
